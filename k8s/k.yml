apiVersion: apps/v1
kind: Deployment
metadata:
  name: nasrr-game
  labels:
    app: nasrr-game
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nasrr-game
  template:
    metadata:
      labels:
        app: nasrr-game
    spec:
      containers:
        - name: nasrr-game
          image: docker.io/nasrullah125/nasrr-game:c070563f6a64437f08f8e9d206967795f8c37806
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nasrr-game
spec:
  type: ClusterIP
  selector:
    app: nasrr-game
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nasrr-game-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: nasrr-game.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nasrr-game
                port:
                  number: 80
